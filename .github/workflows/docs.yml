name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'packages/dacha/src/**'
      - 'packages/dacha/typedoc.json'
      - 'packages/dacha/package.json'
      - 'packages/dacha/tsconfig*.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --workspace=dacha --include-workspace-root --ignore-scripts

      - run: npm run docs -w dacha

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/dacha/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
